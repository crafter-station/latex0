name: Engine conformance

# Every change to the engine is checked against real TeX: committed data must
# match TeX's files, the oracles must agree with pdflatex, every fixture must be
# identical to TeX at 0 sp (and none may regress against main's scorecard), and
# the scanners, line breaker and hyphenation must match TeX on generated input.

#
# For now it runs only on demand (Actions → Engine conformance → Run workflow,
# or `gh workflow run engine.yml --ref <branch>`); run the same gate locally with
# `bun engine ci` before merging. Restore the pull_request/push triggers to make
# it automatic again.
on:
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # the scorecard comment

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.11
      - name: Cache TeX Live 2025
        uses: actions/cache@v4
        with:
          path: .cache/texlive/2025
          key: texlive-2025-final-${{ runner.os }}-${{ hashFiles('lib/latex/tools/install-tex.sh') }}
      - name: Install TeX (TeX Live 2025, final and frozen, the same everywhere)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils wamerican
          sh lib/latex/tools/install-tex.sh
          echo "$(echo "$PWD"/.cache/texlive/2025/bin/*)" >> "$GITHUB_PATH"
      - name: Committed font and hyphenation data match TeX
        run: bun engine codegen --check
      - name: Oracles agree with pdflatex
        run: bun engine oracle:check
      - name: Fixtures identical to TeX at 0 sp
        run: bun engine unit
      - name: Scorecard does not regress against main
        if: always()
        run: |
          git fetch -q --depth=1 origin main
          git show origin/main:lib/latex/fixtures/scorecard.json > "$RUNNER_TEMP/base.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base.json"
          bun engine scorecard --check --base "$RUNNER_TEMP/base.json" --markdown "$RUNNER_TEMP/scorecard.md"
      - name: Post the scorecard on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # read-only token on forks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file "$RUNNER_TEMP/scorecard.md" --edit-last --create-if-none
      - name: Number, dimension and glue scanning identical to TeX (20,000 cases)
        run: bun engine dimen:check --n 20000
      - name: Glyph runs identical to TeX (10,000 words, 80 fonts + 40 synthetic lig/kern fonts)
        run: bun engine glyph:check --n 10000
      - name: Macro expansion identical to TeX (3,000 random programs)
        run: bun engine expand:check --n 3000
      - name: Document macros expanded for the renderer without changing TeX's output (300 random documents)
        run: bun engine expand:doc --n 300
      - name: Math lists identical to TeX (3,000 random formulas)
        run: bun engine math:check --n 3000
      - name: Line breaking, footnotes and pages identical to TeX (1,000 random paragraphs)
        run: bun engine fuzz:paragraphs --n 1000 --seed 1
      - name: Whole documents identical to TeX (30 random documents with sections, lists, math and footnotes)
        run: bun engine fuzz:documents --n 30 --seed 1
      - name: Hyphenation identical to TeX (20,000 words)
        run: bun engine hyphen:check --words 20000
